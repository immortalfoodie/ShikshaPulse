name: test_overlap_c
description: Randomised placement where most affected blocks carry two adverse effects.
seed: 2024
state: Test Pradesh (fictional)
years: ["2022-23", "2023-24", "2024-25"]
schools_per_block: 40
election:
  year_index: 2
  months: [11, 12]
  teacher_days_lost: [5, 11]
mess:
