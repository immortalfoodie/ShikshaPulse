# Render Blueprint: New → Blueprint → pick this repo. One free Docker web service = API + frontend.
services:
  - type: web
    name: shikshapulse
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PUBLIC_DEMO        # visitors cannot replace the shared demo dataset
        value: "1"
      - key: APP_SECRET         # signs demo session tokens
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY        # paste in the Render dashboard (never commit)
        sync: false
      - key: LLM_API_KEY_FALLBACK
        sync: false
